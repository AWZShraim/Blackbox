[project]
name = "blackbox"
version = "0.1.0"
description = "EDR for AI agents: a mediation and forensics layer for AI agent tool/model traffic"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["common", "mediator", "recorder", "detector", "scenarios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
